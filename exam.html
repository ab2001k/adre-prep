<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADRE 3.0 Mock Test</title>
    <link rel="icon" href="https://fav.farm/📝" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <style>
        /* --- CORE THEME --- */
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        :root { 
            --bg-top: #1b2735;
            --bg-bottom: #090a0f;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --glass-hover: rgba(255, 255, 255, 0.1);
            --neon-blue: #0099ff; /* Dimmer, darker blue for better contrast */
            --correct-green: #00ff88;
            --wrong-red: #ff4b4b;
            --mark-yellow: #ffcc00;
            --skipped-gray: #444444;
            --header-bg: rgba(0, 0, 0, 0.3);
            --footer-bg: #0d0e14;
            --modal-bg: #1a1f2e;
        }

        [data-theme="light"] {
            --bg-top: #e0e7ff;
            --bg-bottom: #f3f4f6;
            --text-color: #111827;
            --text-muted: #4b5563;
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: 1px solid rgba(0, 0, 0, 0.1);
            --glass-hover: rgba(255, 255, 255, 0.9);
            --neon-blue: #2563eb;
            --correct-green: #10b981;
            --wrong-red: #ef4444;
            --mark-yellow: #f59e0b;
            --skipped-gray: #9ca3af;
            --header-bg: rgba(255, 255, 255, 0.5);
            --footer-bg: #ffffff;
            --modal-bg: #ffffff;
        }

        body {
            margin: 0; font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top, var(--bg-top) 0%, var(--bg-bottom) 100%);
            color: var(--text-color); height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            -webkit-touch-callout: none;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* --- 1. HEADER --- */
        .quiz-header {
            background: var(--header-bg); backdrop-filter: blur(10px);
            padding: 10px 15px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: var(--glass-border); height: 60px; flex-shrink: 0; z-index: 10;
        }
        
        .header-left { display: flex; align-items: center; gap: 10px; }
        
        .home-btn {
            background: var(--glass-bg); border: var(--glass-border); color: var(--text-color);
            padding: 8px 15px; border-radius: 20px; font-size: 13px; font-weight: 500;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .home-btn:active { background: var(--glass-hover); transform: scale(0.95); }
        
        .theme-btn {
            background: transparent; border: none; color: var(--text-color); font-size: 20px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s ease;
        }
        .theme-btn:active { transform: scale(0.9); }

        /* NEW: Mode Switch styling */
        .mode-switch {
            background: var(--glass-bg); border: var(--glass-border); color: var(--text-muted);
            padding: 6px 12px; border-radius: 15px; font-size: 12px; font-weight: bold;
            cursor: pointer; transition: all 0.3s; display: flex; align-items: center;
        }
        .mode-switch.quiz-active {
            background: color-mix(in srgb, var(--correct-green) 15%, transparent);
            border-color: var(--correct-green); color: var(--correct-green);
        }

        .timer-box {
            font-family: monospace; font-size: 16px; font-weight: bold;
            color: var(--neon-blue); border: 1px solid var(--neon-blue);
            padding: 4px 12px; border-radius: 8px; background: color-mix(in srgb, var(--neon-blue) 10%, transparent);
            display: flex; align-items: center; gap: 5px; transition: all 0.3s ease;
        }
        
        @keyframes pulseWarning {
            0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--wrong-red) 40%, transparent); }
            70% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--wrong-red) 0%, transparent); }
            100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--wrong-red) 0%, transparent); }
        }
        
        .timer-box.warning { 
            color: var(--wrong-red); border-color: var(--wrong-red); 
            background: color-mix(in srgb, var(--wrong-red) 10%, transparent); 
            animation: pulseWarning 1s infinite; 
        }

        /* --- 2. PALETTE STRIPE --- */
        .palette-stripe {
            display: flex; overflow-x: auto; gap: 8px; padding: 12px 15px;
            background: color-mix(in srgb, var(--bg-top) 50%, transparent); 
            border-bottom: var(--glass-border); flex-shrink: 0; scrollbar-width: none;
        }
        .palette-stripe::-webkit-scrollbar { display: none; }
        
        .p-btn {
            width: 42px; height: 42px; flex-shrink: 0; border-radius: 10px;
            background: var(--glass-bg); border: var(--glass-border);
            color: var(--text-color); font-size: 14px; font-weight: bold;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; position: relative; transition: all 0.2s;
        }
        .p-btn.active { border: 2px solid var(--neon-blue); transform: scale(1.08); box-shadow: 0 0 10px color-mix(in srgb, var(--neon-blue) 30%, transparent); }
        
        .p-btn.attempted { background: var(--correct-green); color: var(--bg-top); border-color: var(--correct-green); }
        .p-btn.skipped { background: var(--wrong-red); color: #fff; border-color: var(--wrong-red); }
        
        .p-btn.rev-correct { background: var(--correct-green) !important; color: var(--bg-top) !important; border-color: var(--correct-green); }
        .p-btn.rev-wrong { background: var(--wrong-red) !important; color: #fff !important; border-color: var(--wrong-red); }
        .p-btn.rev-skipped { background: var(--skipped-gray) !important; color: #fff !important; border-color: var(--text-muted); }

        .star-icon { font-size: 12px; position: absolute; top: -4px; right: -4px; display: none; color: var(--mark-yellow); filter: drop-shadow(0 0 2px rgba(0,0,0,0.5)); }
        .p-btn.marked .star-icon { display: block; }
        .p-btn.marked { border: 2px solid var(--mark-yellow); } 
        .p-btn.marked:not(.attempted):not(.rev-correct):not(.rev-wrong):not(.rev-skipped) { background: var(--mark-yellow); color: #000; }

        /* --- 3. QUESTION AREA --- */
        .content-area {
            flex: 1; overflow-y: auto; padding: 20px 15px; padding-bottom: 100px;
            max-width: 800px; margin: 0 auto; width: 100%; box-sizing: border-box; scroll-behavior: smooth;
        }
        
        .q-card {
            background: var(--glass-bg); border: var(--glass-border);
            border-radius: 20px; padding: 25px 20px; position: relative;
            animation: fadeIn 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            backdrop-filter: blur(10px);
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .q-meta { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; }
        .q-badge { background: color-mix(in srgb, var(--neon-blue) 15%, transparent); color: var(--neon-blue); border: 1px solid var(--neon-blue); font-size: 12px; padding: 4px 10px; border-radius: 6px; font-weight: bold; letter-spacing: 0.5px; }
        .report-link { display: flex; align-items: center; gap: 5px; color: var(--wrong-red); font-size: 12px; font-weight: 500; cursor: pointer; opacity: 0.8; transition: 0.2s; }
        .report-link:hover { opacity: 1; text-decoration: underline; }

        .q-text { font-size: 18px; line-height: 1.6; margin-bottom: 30px; font-weight: 500; }

        .opt-btn {
            width: 100%; text-align: left; padding: 16px 20px; margin-bottom: 15px;
            background: var(--glass-bg); border: var(--glass-border);
            border-radius: 12px; color: var(--text-color); font-size: 16px; cursor: pointer;
            transition: all 0.2s; position: relative; -webkit-tap-highlight-color: transparent;
            display: flex; align-items: center; gap: 10px; font-family: inherit;
        }
        .opt-btn:active { transform: scale(0.98); background: var(--glass-hover); }
        .opt-btn.selected { 
            background: color-mix(in srgb, var(--neon-blue) 15%, transparent); 
            border-color: var(--neon-blue); box-shadow: 0 0 15px color-mix(in srgb, var(--neon-blue) 20%, transparent); 
        }
        
        .opt-btn.correct { background: color-mix(in srgb, var(--correct-green) 15%, transparent); border-color: var(--correct-green); }
        .opt-btn.wrong { background: color-mix(in srgb, var(--wrong-red) 15%, transparent); border-color: var(--wrong-red); }

        /* --- 4. FOOTER CONTROLS --- */
        .footer-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 80px;
            background: var(--footer-bg); border-top: var(--glass-border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; box-sizing: border-box; z-index: 20;
            box-shadow: 0 -5px 30px rgba(0,0,0,0.1); transition: background 0.4s ease;
        }
        
        .f-btn {
            padding: 12px 20px; border-radius: 12px; font-weight: bold; font-size: 15px;
            border: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
            transition: all 0.2s; font-family: inherit;
        }
        .f-btn:active { transform: scale(0.95); }
        .f-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .btn-prev { background: var(--glass-bg); color: var(--text-color); border: var(--glass-border); }
        .btn-mark { background: transparent; border: 1px solid var(--mark-yellow); color: var(--mark-yellow); }
        .btn-next { background: var(--neon-blue); color: #ffffff; box-shadow: 0 0 15px color-mix(in srgb, var(--neon-blue) 40%, transparent); }
        
        .btn-submit { 
            background: var(--correct-green); color: #000; display: none; 
            box-shadow: 0 0 15px color-mix(in srgb, var(--correct-green) 40%, transparent); 
            justify-content: center; width: auto; padding: 12px 25px;
        }

        /* --- MODALS --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;
            backdrop-filter: blur(8px);
        }
        .modal-box {
            background: var(--modal-bg); width: 90%; max-width: 380px; padding: 30px;
            border-radius: 25px; text-align: center; border: var(--glass-border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); transition: background 0.4s ease;
        }
        
        .student-badge {
            display: inline-flex; align-items: center; gap: 8px; background: var(--glass-bg); padding: 8px 18px;
            border-radius: 20px; color: var(--text-color); font-size: 14px; margin-bottom: 25px;
            border: var(--glass-border); font-weight: 500;
        }
        
        .score-circle {
            width: 130px; height: 130px; border-radius: 50%; border: 8px solid var(--text-muted);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin: 0 auto 25px; font-size: 36px; font-weight: bold; color: var(--text-color);
            background: var(--glass-bg); transition: border-color 1s ease, box-shadow 1s ease;
        }
        .motivational-text { font-size: 16px; font-weight: 600; font-style: italic; margin-bottom: 25px; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="quiz-header">
        <div class="header-left">
            <button class="home-btn" onclick="attemptExit()">
                <svg width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Exit
            </button>
            <button class="theme-btn" onclick="toggleSound()" id="sound-btn" title="Toggle Sound"></button>
            <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle Theme"></button>
            
            <!-- NEW: Quiz Mode Toggle -->
            <div class="mode-switch" onclick="toggleQuizMode()" id="mode-btn" title="Toggle Quiz Mode">
                <span id="mode-text">Mock Mode</span>
            </div>
        </div>
        <span style="font-size:15px; color:var(--text-muted); font-weight:600; display:none;" id="test-subject-display">Mock Test</span>
        <div class="timer-box" id="timer">
            <svg width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span id="timer-text">00:00</span>
        </div>
    </div>

    <div class="palette-stripe" id="palette-container"></div>

    <div class="content-area">
        <div class="q-card" id="question-card">
            <p style="text-align:center; color:var(--text-muted);">Loading your test...</p>
        </div>
    </div>

    <div class="footer-bar">
        <div style="display:flex; gap:12px;">
            <button class="f-btn btn-prev" id="btn-prev" onclick="prevQuestion()" disabled>
                <svg width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button class="f-btn btn-mark" onclick="markReview()">
                <svg width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            </button>
        </div>
        
        <button class="f-btn btn-next" id="btn-next" onclick="nextQuestion()">
            Next 
            <svg width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button class="f-btn btn-submit" id="btn-submit" onclick="submitTest()">
            <svg width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            Calculate My Score
        </button>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-box">
            <h2 style="color:var(--text-color); margin:0 0 15px 0; text-transform: uppercase; letter-spacing: 1px;">Report Card</h2>
            <div class="student-badge" id="studentNameDisplay">
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                Candidate: Loading...
            </div>
            
            <div class="score-circle" id="scoreDisplay">
                <span id="scoreVal">0%</span>
                <span style="font-size:12px; color:var(--text-muted); font-weight:normal; margin-top: -5px;">ACCURACY</span>
            </div>
            
            <p id="resultMsg" style="color:var(--text-muted); font-size:16px; margin-bottom:8px;">...</p>
            <p class="motivational-text" id="motivationMsg">Keep Grinding! 🔥</p>
            
            <button class="f-btn" style="background:var(--neon-blue); color:#ffffff; width:100%; margin-bottom:12px; justify-content:center;" onclick="reviewAnswers()">
                <svg width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20"/><path d="M12 2v20"/><path d="m4.93 4.93 14.14 14.14"/><path d="m4.93 19.07 14.14-14.14"/></svg>
                Check Solutions
            </button>
            <button class="f-btn" style="background:transparent; border:1px solid var(--text-muted); color:var(--text-color); width:100%; justify-content:center;" onclick="exitSafely()">
                Back to Home
            </button>
            
            <div style="text-align: center; margin-top: 22px; color: var(--text-muted); font-size: 12px; font-weight: 500; letter-spacing: 1px;">
                Designed by Abhik Dutta
            </div>
        </div>
    </div>

    <script>
        // --- SVG ASSETS ---
        const svgSun = `<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`;
        const svgMoon = `<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;
        const svgSoundOn = `<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>`;
        const svgSoundOff = `<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>`;

        // --- THEME SYNC ---
        function updateThemeIcon() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            document.getElementById('theme-btn').innerHTML = currentTheme === 'light' ? svgSun : svgMoon;
        }

        function toggleTheme() {
            playSound();
            let currentTheme = document.documentElement.getAttribute('data-theme');
            let newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon();
        }
        
        // --- SOUND SYNC ---
        function updateSoundIcon() {
            const isSoundOn = localStorage.getItem('soundEnabled') !== 'false';
            document.getElementById('sound-btn').innerHTML = isSoundOn ? svgSoundOn : svgSoundOff;
        }
        
        function toggleSound() {
            const isSoundOn = localStorage.getItem('soundEnabled') !== 'false';
            localStorage.setItem('soundEnabled', !isSoundOn);
            updateSoundIcon();
            if(!isSoundOn) playSound(); // Play sound immediately when toggling back on
        }

        // Initialize icons on load
        updateThemeIcon();
        updateSoundIcon();

        // --- SOUND SYSTEM ---
        const popSound = new Audio("data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YRAAAACAAAAA//8AAP//AAAAAA=="); 
        const correctSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3");
        const wrongSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3");

        function playSound() {
            const isSoundOn = localStorage.getItem('soundEnabled') !== 'false';
            if(isSoundOn) { 
                const sound = popSound.cloneNode();
                sound.volume = 0.3; 
                sound.play().catch(e => {}); 
            }
        }

        function playFeedbackSound(isCorrect) {
            const isSoundOn = localStorage.getItem('soundEnabled') !== 'false';
            if(isSoundOn) {
                const sound = isCorrect ? correctSound.cloneNode() : wrongSound.cloneNode();
                sound.volume = 0.4;
                sound.play().catch(e => {});
            }
        }

       // --- CONFIG & CACHING LOGIC ---
        // REPLACE THESE GIDs WITH YOUR ACTUAL SHEET 1 AND SHEET 2 GIDs
        const SHEET_1_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRO7WqDZ2QCRy-Hng8vdpVGTsSm4lp8n5gamqUSF5J1I-6jVtK1UZLHOYMN7p_xSpFI3RGuuPH3l35M/pub?gid=0&single=true&output=csv'; 
        const SHEET_2_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRO7WqDZ2QCRy-Hng8vdpVGTsSm4lp8n5gamqUSF5J1I-6jVtK1UZLHOYMN7p_xSpFI3RGuuPH3l35M/pub?gid=408771765&single=true&output=csv'; 
        
        const CACHE_KEY = 'adre_qbank_cache';
        const CACHE_TIME_KEY = 'adre_qbank_time';
        const CACHE_DURATION = 24 * 60 * 60 * 1000; // Cache valid for 24 hours
        
        const SECONDS_PER_QUESTION = 60;
        
        let questions = [], currentQIndex = 0, userAnswers = {}, qStatus = {}, timeRemaining = 0, timerInterval;
        let isReviewMode = false, isSubmitted = false;
        let isQuizMode = false; // NEW: Quiz mode state
        let studentName = "Future Officer"; 

        const urlParams = new URLSearchParams(window.location.search);
        const testID = urlParams.get('id');
        const subjectName = urlParams.get('subject') || "Test";
        document.getElementById('test-subject-display').innerText = subjectName;

        // --- NEW: QUIZ MODE TOGGLE ---
        function toggleQuizMode() {
            playSound();
            isQuizMode = !isQuizMode;
            const btn = document.getElementById('mode-btn');
            const txt = document.getElementById('mode-text');
            if(isQuizMode) {
                btn.classList.add('quiz-active');
                txt.innerText = "Quiz Mode";
            } else {
                btn.classList.remove('quiz-active');
                txt.innerText = "Mock Mode";
            }
            // Refresh current question layout if it's already on screen
            if(questions.length > 0) loadQuestion(currentQIndex);
        }

        // --- EXIT PROTECTION ---
        window.onbeforeunload = function() {
            if (!isSubmitted) return "You have not submitted the test.";
        };
        function attemptExit() {
            playSound();
            if(!isSubmitted) {
                if(confirm("⚠️ Warning: Your progress will be lost.\n\nAre you sure you want to exit?")) window.location.href = 'index.html';
            } else {
                window.location.href = 'index.html';
            }
        }
        function exitSafely() { playSound(); isSubmitted = true; window.location.href = 'index.html'; }

        // --- FAST RETRIEVAL / CACHING INIT ---
        window.onload = async function() {
            if (!testID) return document.getElementById('question-card').innerHTML = '<p style="text-align:center; color:var(--wrong-red);">No Test ID provided in URL.</p>';
            
            const cachedData = localStorage.getItem(CACHE_KEY);
            const cachedTime = localStorage.getItem(CACHE_TIME_KEY);
            const now = Date.now();

            // 1. If we have fresh cache, use it immediately (Zero Delay)
            if (cachedData && cachedTime && (now - parseInt(cachedTime)) < CACHE_DURATION) {
                parseCSV(cachedData);
                // 2. Silently fetch new updates in background to keep cache fresh for next time
                updateCacheSilently();
            } else {
                // 3. Otherwise, fetch, cache, and parse
                await fetchAndCache();
            }
        };

        async function fetchAndCombineSheets() {
            // Fetch both sheets at the exact same time
            const [response1, response2] = await Promise.all([
                fetch(SHEET_1_URL),
                fetch(SHEET_2_URL)
            ]);

            if (!response1.ok || !response2.ok) throw new Error("Failed to load one or more sheets");

            const text1 = await response1.text();
            let text2 = await response2.text();

            // Remove the header row from Sheet 2 so we don't have a header stuck in the middle of our data
            const text2Lines = text2.split(/\r?\n/);
            text2Lines.shift(); 
            text2 = text2Lines.join('\n');

            // Combine them
            return text1 + '\n' + text2;
        }

        async function fetchAndCache() {
            try {
                const combinedCSV = await fetchAndCombineSheets();
                
                // Save the combined data to localStorage
                localStorage.setItem(CACHE_KEY, combinedCSV);
                localStorage.setItem(CACHE_TIME_KEY, Date.now());
                
                parseCSV(combinedCSV);
            } catch (e) {
                // Fallback to stale cache if offline
                const staleData = localStorage.getItem(CACHE_KEY);
                if (staleData) {
                    parseCSV(staleData);
                } else {
                    document.getElementById('question-card').innerHTML = '<p style="text-align:center; color:var(--wrong-red);">Error loading questions. Check your internet connection.</p>';
                }
            }
        }

        async function updateCacheSilently() {
            try {
                const combinedCSV = await fetchAndCombineSheets();
                // Update cache quietly in the background
                localStorage.setItem(CACHE_KEY, combinedCSV);
                localStorage.setItem(CACHE_TIME_KEY, Date.now());
            } catch (e) { 
                /* Ignore silent errors in background */ 
            }
        }

        function parseCSV(csvText) {
            const rows = csvText.split(/\r?\n/).slice(1); // Skip sheet 1 header
            
            questions = [];
            rows.forEach(row => {
                if(row.trim().length === 0) return; 
                
                const c = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(x => x.replace(/^"|"$/g, '').trim());
                if(c.length >= 7 && c[0] === testID) {
                    questions.push({ q: c[1], options: [c[2], c[3], c[4], c[5]], correct: parseInt(c[6]) });
                }
            });
            
            if (questions.length === 0) {
                document.getElementById('question-card').innerHTML = `
                    <p style="text-align:center; color:var(--wrong-red);">No questions found for Test ID: <b>${testID}</b></p>`;
            } else {
                initQuiz();
            }
        }

        const svgStar = `<svg class="star-icon" width="1em" height="1em" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;

        function initQuiz() {
            timeRemaining = questions.length * SECONDS_PER_QUESTION;
            startTimer();
            const p = document.getElementById('palette-container');
            p.innerHTML = '';
            questions.forEach((_, i) => {
                const btn = document.createElement('div');
                btn.className = 'p-btn';
                btn.innerHTML = `${i + 1} ${svgStar}`; 
                btn.onclick = () => { playSound(); jumpToQuestion(i); };
                btn.id = `pal-${i}`;
                p.appendChild(btn);
            });
            questions.forEach((_, i) => { userAnswers[i] = null; qStatus[i] = 'not-visited'; });
            loadQuestion(0);
        }

        // --- NEW: VERIFY QUESTION ON GOOGLE ---
        function verifyQuestionOnGoogle() {
            playSound();
            const q = questions[currentQIndex];
            const query = encodeURIComponent(q.q + " " + q.options.join(" "));
            window.open("https://www.google.com/search?q=" + query, "_blank");
        }

        // --- UPDATED: REPORT QUESTION LOGIC ---
        function reportQuestion() {
            playSound();
            
            // Getting the actual data you requested
            const testNumberText = subjectName; // e.g., "PET Mock 1"
            const qNoText = currentQIndex + 1;  // e.g., "25"
            
            // Your Google Form link
            const formBaseURL = "https://docs.google.com/forms/d/e/1FAIpQLSdxAZVkTzwjUvPwhfB1W176ib2ZI-jc3jahhxw1dsIgGn2uNA/viewform?usp=pp_url";
            
            // IMPORTANT: Replace 'entry.111' with your real Google form entry ID for "Test Number"
            // Replace 'entry.222' with your real Google form entry ID for "Question Number"
            const prefilledURL = formBaseURL + 
                "&entry.111=" + encodeURIComponent(testNumberText) + 
                "&entry.222=" + encodeURIComponent(qNoText);
            
            window.open(prefilledURL, "_blank");
        }

        function loadQuestion(idx) {
            currentQIndex = idx;
            const q = questions[idx];
            const el = document.getElementById('question-card');
            
            // NEW: Injected the Verify Button next to the Report button
            let html = `
                <div class="q-meta">
                    <span class="q-badge">Question ${idx + 1} of ${questions.length}</span>
                    <div style="display:flex; gap: 15px;">
                        <span class="report-link" style="color:var(--neon-blue);" onclick="verifyQuestionOnGoogle()">
                            <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            Verify
                        </span>
                        <span class="report-link" onclick="reportQuestion()">
                            <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg>
                            Report
                        </span>
                    </div>
                </div>
                <div class="q-text">${q.q}</div>
                <div>`;
            
            q.options.forEach((opt, i) => {
                let cls = 'opt-btn';
                
                // NEW: Logic applies colors instantly if in Quiz Mode and an answer was picked
                if(isReviewMode || (isQuizMode && userAnswers[idx] !== null)) {
                    if(i === q.correct) cls += ' correct'; 
                    else if(userAnswers[idx] === i) cls += ' wrong';
                } else {
                    if(userAnswers[idx] === i) cls += ' selected';
                }
                
                const alpha = String.fromCharCode(65 + i);
                // Also disable buttons if in review mode OR if quiz mode answer is already submitted
                const isDisabled = isReviewMode || (isQuizMode && userAnswers[idx] !== null) ? 'disabled' : '';

                html += `<button class="${cls}" onclick="selectOption(${i})" ${isDisabled}>
                            <span style="font-weight:bold; color:var(--neon-blue); opacity:0.8; margin-right:5px;">${alpha}.</span> 
                            ${opt}
                         </button>`;
            });
            html += `</div>`;
            el.innerHTML = html;
            updateUI();
        }

        function updateUI() {
            const activeBtn = document.getElementById(`pal-${currentQIndex}`);
            if(activeBtn) {
                activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('active'));
                activeBtn.classList.add('active');
            }

            questions.forEach((_, i) => {
                const btn = document.getElementById(`pal-${i}`);
                btn.classList.remove('attempted', 'skipped', 'marked', 'rev-correct', 'rev-wrong', 'rev-skipped');

                if(isReviewMode) {
                    if (userAnswers[i] === null) {
                        btn.classList.add('rev-skipped');
                    } else if (userAnswers[i] === questions[i].correct) {
                        btn.classList.add('rev-correct');
                    } else {
                        btn.classList.add('rev-wrong');
                    }
                    if(qStatus[i] === 'marked') btn.classList.add('marked');
                } else {
                    if(userAnswers[i] !== null) btn.classList.add('attempted');
                    if(qStatus[i] === 'marked') btn.classList.add('marked');
                    else if(qStatus[i] === 'visited' && userAnswers[i] === null) btn.classList.add('skipped');
                }
            });

            document.getElementById('btn-prev').disabled = (currentQIndex === 0);
            if(currentQIndex === questions.length - 1) {
                document.getElementById('btn-next').style.display = 'none';
                document.getElementById('btn-submit').style.display = 'flex';
            } else {
                document.getElementById('btn-next').style.display = 'flex';
                document.getElementById('btn-submit').style.display = 'none';
            }
            
            if(isReviewMode) {
                document.getElementById('btn-submit').style.display = 'flex';
                document.getElementById('btn-submit').innerHTML = `<svg width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> Finish Review`;
                document.getElementById('btn-submit').onclick = () => exitSafely();
                document.getElementById('btn-next').style.display = (currentQIndex === questions.length - 1) ? 'none' : 'flex';
            }
        }

        // --- ACTIONS ---
        function selectOption(i) {
            if(isReviewMode) return;
            
            // NEW: Prevent changing answer if already answered in Quiz Mode
            if(isQuizMode && userAnswers[currentQIndex] !== null) return;
            
            userAnswers[currentQIndex] = i;
            if(qStatus[currentQIndex] !== 'marked') qStatus[currentQIndex] = 'visited';
            
            // NEW: Instant feedback logic for Quiz Mode
            if(isQuizMode) {
                const isCorrect = (i === questions[currentQIndex].correct);
                playFeedbackSound(isCorrect);
                loadQuestion(currentQIndex); // Reload to show green/red colors immediately
            } else {
                playSound();
                loadQuestion(currentQIndex); 
            }
        }

        function nextQuestion() {
            playSound();
            if(qStatus[currentQIndex] !== 'marked') qStatus[currentQIndex] = 'visited';
            if(currentQIndex < questions.length - 1) loadQuestion(currentQIndex + 1);
        }
        function prevQuestion() {
            playSound();
            if(currentQIndex > 0) loadQuestion(currentQIndex - 1);
        }
        function jumpToQuestion(i) {
            if(qStatus[currentQIndex] !== 'marked') qStatus[currentQIndex] = 'visited';
            loadQuestion(i);
        }
        function markReview() {
            playSound();
            if(isReviewMode) return;
            qStatus[currentQIndex] = (qStatus[currentQIndex] === 'marked') ? 'visited' : 'marked';
            updateUI();
        }

        // --- TIMER & SUBMIT ---
        function startTimer() {
            const box = document.getElementById('timer');
            const el = document.getElementById('timer-text');
            timerInterval = setInterval(() => {
                let m = Math.floor(timeRemaining / 60), s = timeRemaining % 60;
                el.innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
                if(timeRemaining <= 60 && timeRemaining > 0) box.classList.add('warning');
                else box.classList.remove('warning');
                
                if(timeRemaining-- <= 0) { clearInterval(timerInterval); submitTest(); }
            }, 1000);
        }

        async function submitTest() {
            if(isReviewMode) return;
            clearInterval(timerInterval);
            isSubmitted = true; 
            
            let score = 0;
            questions.forEach((q, i) => { if(userAnswers[i] === q.correct) score++; });
            const pct = Math.round((score/questions.length)*100);
            
         

            document.getElementById('studentNameDisplay').innerHTML = `<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> ${studentName}`;
            document.getElementById('scoreVal').innerText = pct + "%";
            document.getElementById('resultMsg').innerText = `You scored ${score} out of ${questions.length}`;
            
            const circle = document.getElementById('scoreDisplay');
            const motiv = document.getElementById('motivationMsg');
            
            if(pct >= 80) { 
                circle.style.borderColor = "var(--correct-green)"; 
                circle.style.boxShadow = "0 0 30px color-mix(in srgb, var(--correct-green) 40%, transparent)";
                motiv.innerText = "Outstanding! You are exam ready! 🌟"; 
                motiv.style.color = "var(--correct-green)"; 
            } 
            else if (pct >= 50) { 
                circle.style.borderColor = "var(--mark-yellow)"; 
                circle.style.boxShadow = "0 0 30px color-mix(in srgb, var(--mark-yellow) 40%, transparent)";
                motiv.innerText = "Good effort! Revise the weak areas. 💪"; 
                motiv.style.color = "var(--mark-yellow)"; 
            } 
            else { 
                circle.style.borderColor = "var(--wrong-red)"; 
                circle.style.boxShadow = "0 0 30px color-mix(in srgb, var(--wrong-red) 40%, transparent)";
                motiv.innerText = "Don't give up! Consistency is key. 🔥"; 
                motiv.style.color = "var(--wrong-red)"; 
            }
            
            document.getElementById('resultModal').style.display = 'flex';
        }

        function reviewAnswers() {
            playSound();
            isReviewMode = true;
            document.getElementById('resultModal').style.display = 'none';
            loadQuestion(0);
        }

        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false;
            if(e.ctrlKey && (e.keyCode == 85 || e.keyCode == 67 || e.keyCode == 83 || (e.shiftKey && e.keyCode == 73))) return false;
        };
        document.ondragstart = function() { return false; };
    </script>
